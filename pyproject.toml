[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergen"
version = "0.1.0"
description = "Deterministic control plane for isolated engineering-agent executions"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
