name: Phase B K3s Job proof

on:
  push:
    branches: [dev-agent]
  pull_request:
    branches: [dev-user]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k3s-job-proof:
    runs-on: ubuntu-latest
    env:
      K3D_VERSION: v5.9.0
      CLUSTER: mergen-proof
    steps:
      - uses: actions/checkout@v4
      - name: Install verified K3d
        run: |
          curl --fail --location --silent --show-error "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64" --output "$RUNNER_TEMP/k3d"
          curl --fail --location --silent --show-error "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          expected_checksum="$(awk '$2 == "_dist/k3d-linux-amd64" { print $1 }' "$RUNNER_TEMP/checksums.txt")"
          test -n "$expected_checksum"
          printf '%s  %s\n' "$expected_checksum" "$RUNNER_TEMP/k3d" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/k3d"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create a single-node K3s cluster
        run: k3d cluster create "$CLUSTER" --servers 1 --agents 0 --wait
      - name: Build and import the proof image
        run: |
          docker build --tag mergen/cpp-cmake:0.1 infrastructure/docker/cpp-cmake
          docker build --tag mergen/k3s-cpp-cmake-proof:0.1 --file infrastructure/kubernetes/runtime-proof/Dockerfile .
          k3d image import mergen/k3s-cpp-cmake-proof:0.1 --cluster "$CLUSTER"
      - name: Verify success, failure, timeout, and TTL cleanup
        run: |
          kubectl apply --filename infrastructure/kubernetes/runtime-proof/namespace.yaml
          kubectl apply --filename infrastructure/kubernetes/runtime-proof/job-success.yaml
          kubectl --namespace mergen-runtime-proof wait --for=condition=complete job/runtime-proof --timeout=120s
          kubectl --namespace mergen-runtime-proof logs job/runtime-proof
          kubectl --namespace mergen-runtime-proof wait --for=delete job/runtime-proof --timeout=90s
          kubectl apply --filename infrastructure/kubernetes/runtime-proof/job-failure.yaml
          kubectl --namespace mergen-runtime-proof wait --for=condition=failed job/runtime-proof-failure --timeout=120s
          kubectl apply --filename infrastructure/kubernetes/runtime-proof/job-timeout.yaml
          kubectl --namespace mergen-runtime-proof wait --for=condition=failed job/runtime-proof-timeout --timeout=120s
      - name: Delete cluster
        if: always()
        run: command -v k3d >/dev/null && k3d cluster delete "$CLUSTER" || true
